name: Import verified V2 source
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-android.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import checksum-verified prepared source
        shell: bash
        run: |
          set -euo pipefail
          test -f PrecisionRTA-2.0.0-source.zip || exit 0
          echo '1102c0f877dc6e28facc1ce0837236d1790d1d7d6dcb7b36e5e60adb9c80e10a  PrecisionRTA-2.0.0-source.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          from pathlib import Path, PurePosixPath
          with zipfile.ZipFile('PrecisionRTA-2.0.0-source.zip') as z:
              for f in z.infolist():
                  p=PurePosixPath(f.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  if f.is_dir() or f.filename.startswith('.github/'):
                      continue
                  target=Path(f.filename)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(f))
          Path('PrecisionRTA-2.0.0-source.zip').unlink()
          PY
          chmod +x gradlew build.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import verified V2 source, tests and documentation'
          git push origin HEAD:main
